name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: V2rayNG

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK and platform 37
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build fdroid debug APK
        run: ./gradlew :app:assembleFdroidDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayng-apk
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
