name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: V2rayNG

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept licenses and install platform 37
        run: |
          set +o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-37"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build fdroid debug APK
        run: ./gradlew :app:assembleFdroidDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayng-apk
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
